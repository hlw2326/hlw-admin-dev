<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="claude">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://console.anthropic.com/">Anthropic Claude</a></p>
            <p>国际顶尖大语言模型，具备卓越的代码生成、长文本理解与严密逻辑推理能力</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">Claude Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[claude_key]" value="{:sysconf('ai.claude_key')}" required vali-name="API Key" placeholder="sk-ant-api03-xxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ Anthropic Console > API Keys ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[claude_model]" value="{:sysconf('ai.claude_model')?:'claude-3-5-sonnet-20241022'}" required vali-name="默认模型" placeholder="claude-3-5-sonnet-20241022" class="layui-input">
                <p class="help-block">推荐：<code>claude-3-5-sonnet-20241022</code>（旗舰强推理）、<code>claude-3-5-haiku-20241022</code>（极速高性价比）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[claude_endpoint]" value="{:sysconf('ai.claude_endpoint')}" placeholder="默认：https://api.anthropic.com/v1/messages" class="layui-input">
                <p class="help-block">支持 Anthropic 原生 Messages 接口或第三方 OpenAI 兼容反代网关</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
