<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="deepseek">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://platform.deepseek.com/">DeepSeek 开放平台</a> 提供大模型 AI 能力</p>
            <p>国产高性价比通用大语言模型，支持 DeepSeek-V3 对话模型与 DeepSeek-R1 深度思考推理模型</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">接口密钥</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[deepseek_key]" value="{:sysconf('ai.deepseek_key')}" required vali-name="API Key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ DeepSeek 开放平台 > API Keys ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[deepseek_model]" value="{:sysconf('ai.deepseek_model')?:'deepseek-chat'}" required vali-name="默认模型" placeholder="deepseek-chat" class="layui-input">
                <p class="help-block">推荐：<code>deepseek-chat</code>（通用对话与文本补全）或 <code>deepseek-reasoner</code>（推理思考模型）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[deepseek_endpoint]" value="{:sysconf('ai.deepseek_endpoint')}" placeholder="默认：https://api.deepseek.com/chat/completions" class="layui-input">
                <p class="help-block">自定义 API 接口端点，留空时使用官方默认地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，值越小回答越严谨保守，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
