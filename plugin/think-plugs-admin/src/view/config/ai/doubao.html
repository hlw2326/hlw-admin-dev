<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="doubao">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://console.volcengine.com/ark/">字节跳动豆包 (火山方舟)</a></p>
            <p>字节跳动自研大模型，极高性价比与高并发吞吐能力，全面覆盖日常对话与业务场景</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">Ark Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[doubao_key]" value="{:sysconf('ai.doubao_key')}" required vali-name="API Key" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ 火山引擎火山方舟平台 > API Key 管理 ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">接入点/模型</b><br><span class="nowrap color-desc">Model / Endpoint ID</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[doubao_model]" value="{:sysconf('ai.doubao_model')?:'doubao-pro-32k'}" required vali-name="默认模型" placeholder="ep-2025xxxx-xxxx 或 doubao-pro-32k" class="layui-input">
                <p class="help-block">建议填写火山方舟控制台创建的接入点 Endpoint ID（如 <code>ep-20250101-xxxx</code>）或预置模型名</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[doubao_endpoint]" value="{:sysconf('ai.doubao_endpoint')}" placeholder="默认：https://ark.cn-beijing.volces.com/api/v3/chat/completions" class="layui-input">
                <p class="help-block">火山方舟标准兼容接口，留空时使用官方默认兼容端点</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
