<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="gemini">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://aistudio.google.com/">Google Gemini</a></p>
            <p>谷歌自研新一代原生多模态大模型，超长上下文窗口支持，逻辑与多模态能力强劲</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">Gemini Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[gemini_key]" value="{:sysconf('ai.gemini_key')}" required vali-name="API Key" placeholder="AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ Google AI Studio > Get API key ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[gemini_model]" value="{:sysconf('ai.gemini_model')?:'gemini-1.5-flash'}" required vali-name="默认模型" placeholder="gemini-1.5-flash" class="layui-input">
                <p class="help-block">推荐：<code>gemini-1.5-flash</code>（轻量极速）、<code>gemini-1.5-pro</code>（百万上下文旗舰推理）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[gemini_endpoint]" value="{:sysconf('ai.gemini_endpoint')}" placeholder="默认：https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" class="layui-input">
                <p class="help-block">Google 官方 OpenAI 规范兼容地址，国内请配置中转代理端点</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
