<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="hunyuan">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://console.cloud.tencent.com/hunyuan">腾讯云混元大模型</a></p>
            <p>腾讯全链路自研大模型，深度融入腾讯云生态，支持文生文、逻辑推理及多轮对话</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">Hunyuan Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[hunyuan_key]" value="{:sysconf('ai.hunyuan_key')}" required vali-name="API Key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ 腾讯云混元控制台 > API KEY 管理 ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[hunyuan_model]" value="{:sysconf('ai.hunyuan_model')?:'hunyuan-standard'}" required vali-name="默认模型" placeholder="hunyuan-standard" class="layui-input">
                <p class="help-block">推荐：<code>hunyuan-standard</code>（标准通用）、<code>hunyuan-turbo</code>（深度加速）、<code>hunyuan-lite</code>（轻量极速）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[hunyuan_endpoint]" value="{:sysconf('ai.hunyuan_endpoint')}" placeholder="默认：https://api.hunyuan.cloud.tencent.com/v1/chat/completions" class="layui-input">
                <p class="help-block">腾讯混元 OpenAI 规范兼容接口，留空时使用官方默认兼容端点</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
