<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="minimax">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://platform.minimaxi.com/">MiniMax (名之梦)</a></p>
            <p>通用人工智能科技模型，在复杂角色扮演、智能体对话与语义多模态交互方面优势显著</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">MiniMax Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[minimax_key]" value="{:sysconf('ai.minimax_key')}" required vali-name="API Key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ MiniMax 开放平台 > 账户管理 > 接口密钥 ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[minimax_model]" value="{:sysconf('ai.minimax_model')?:'abab6.5s-chat'}" required vali-name="默认模型" placeholder="abab6.5s-chat" class="layui-input">
                <p class="help-block">推荐：<code>abab6.5s-chat</code>（高性价比对话）、<code>abab6.5t-chat</code>（长上下文）、<code>MiniMax-Text-01</code>（最新万亿 MoE）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[minimax_endpoint]" value="{:sysconf('ai.minimax_endpoint')}" placeholder="默认：https://api.minimax.chat/v1/chat/completions" class="layui-input">
                <p class="help-block">MiniMax OpenAI 规范兼容接口，留空时使用官方默认兼容端点</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
