<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="moonshot">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://platform.moonshot.cn/">月之暗面 Moonshot / Kimi</a></p>
            <p>国产领先的长上下文大语言模型，支持超长文本解析理解与高精度知识问答</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">Moonshot Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[moonshot_key]" value="{:sysconf('ai.moonshot_key')}" required vali-name="API Key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ Moonshot 开放平台 > API Key 管理 ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[moonshot_model]" value="{:sysconf('ai.moonshot_model')?:'moonshot-v1-8k'}" required vali-name="默认模型" placeholder="moonshot-v1-8k" class="layui-input">
                <p class="help-block">推荐：<code>moonshot-v1-8k</code>（通用轻量）、<code>moonshot-v1-32k</code>（中长文本）、<code>moonshot-v1-128k</code>（超长文本）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[moonshot_endpoint]" value="{:sysconf('ai.moonshot_endpoint')}" placeholder="默认：https://api.moonshot.cn/v1/chat/completions" class="layui-input">
                <p class="help-block">兼容 OpenAI 标准接口端点，留空时使用官方默认端点</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
