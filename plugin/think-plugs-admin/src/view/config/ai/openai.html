<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="openai">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://platform.openai.com/">OpenAI ChatGPT</a></p>
            <p>国际主流通用大模型，支持 GPT-4o、GPT-4o-mini 等先进生成式人工智能模型</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">OpenAI Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[openai_key]" value="{:sysconf('ai.openai_key')}" required vali-name="API Key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ OpenAI 控制台 > API Keys ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[openai_model]" value="{:sysconf('ai.openai_model')?:'gpt-4o-mini'}" required vali-name="默认模型" placeholder="gpt-4o-mini" class="layui-input">
                <p class="help-block">推荐：<code>gpt-4o-mini</code>（极速高性价比）或 <code>gpt-4o</code>（旗舰多模态大模型）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[openai_endpoint]" value="{:sysconf('ai.openai_endpoint')}" placeholder="默认：https://api.openai.com/v1/chat/completions" class="layui-input">
                <p class="help-block">国内服务器请填写反向代理地址或 OneAPI / NewAPI 中转地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">默认 0.7，值越大越具发散性</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
