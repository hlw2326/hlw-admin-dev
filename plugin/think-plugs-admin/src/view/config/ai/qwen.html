<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="qwen">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://bailian.console.aliyun.com/">阿里云百炼 / 通义千问 (DashScope)</a></p>
            <p>基于阿里通义实验室全系列模型，支持通用文本创作、代码分析与多轮交互</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">DashScope Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[qwen_key]" value="{:sysconf('ai.qwen_key')}" required vali-name="API Key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" class="layui-input">
                <p class="help-block">在 [ 阿里云百炼控制台 > API-KEY 管理 ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[qwen_model]" value="{:sysconf('ai.qwen_model')?:'qwen-plus'}" required vali-name="默认模型" placeholder="qwen-plus" class="layui-input">
                <p class="help-block">推荐：<code>qwen-plus</code>（能力均衡）、<code>qwen-turbo</code>（极速轻量）、<code>qwen-max</code>（最强旗舰）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[qwen_endpoint]" value="{:sysconf('ai.qwen_endpoint')}" placeholder="默认：https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" class="layui-input">
                <p class="help-block">兼容 OpenAI 标准接口端点，留空时使用官方默认兼容地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
