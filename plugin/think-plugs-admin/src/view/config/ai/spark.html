<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="spark">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://xinghuo.xfyun.cn/sparkapi">科大讯飞星火大模型</a></p>
            <p>科大讯飞自主研发的通用认知大模型，在中文语言理解、常识问答与语音语义方面表现卓越</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">Spark Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[spark_key]" value="{:sysconf('ai.spark_key')}" required vali-name="API Key" placeholder="xxxxxxxxxxxxxxxx:xxxxxxxxxxxxxxxx 或 APIPassword" class="layui-input">
                <p class="help-block">在 [ 讯飞开放平台 > 星火大模型控制台 ] 中获取 APIPassword 或 <code>APIKey:APISecret</code></p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[spark_model]" value="{:sysconf('ai.spark_model')?:'generalv3.5'}" required vali-name="默认模型" placeholder="generalv3.5" class="layui-input">
                <p class="help-block">推荐：<code>generalv3.5</code>（Spark Max 旗舰）、<code>generalv3</code>（Spark Pro）、<code>lite</code>（极速免费）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[spark_endpoint]" value="{:sysconf('ai.spark_endpoint')}" placeholder="默认：https://spark-api-open.xf-yun.com/v1/chat/completions" class="layui-input">
                <p class="help-block">星火 OpenAI 规范兼容接口，留空时使用官方默认端点</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 2.0" class="layui-input">
                <p class="help-block">值越大回答越具创意，建议 0.5 ~ 1.0 之间</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
