<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="ai[type]" value="zhipu">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://open.bigmodel.cn/">智谱 AI 开放平台 (GLM)</a></p>
            <p>清华技术成果转化的全自研大模型，提供强大的语义理解、长文本与逻辑推理能力</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API Key</b><br><span class="nowrap color-desc">GLM API Key</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[zhipu_key]" value="{:sysconf('ai.zhipu_key')}" required vali-name="API Key" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx.xxxxxxxx" class="layui-input">
                <p class="help-block">在 [ 智谱开放平台 > API Keys ] 中创建并获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模型</b><br><span class="nowrap color-desc">Model</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[zhipu_model]" value="{:sysconf('ai.zhipu_model')?:'glm-4-flash'}" required vali-name="默认模型" placeholder="glm-4-flash" class="layui-input">
                <p class="help-block">推荐：<code>glm-4-flash</code>（免费极速调用）、<code>glm-4-air</code>、<code>glm-4-plus</code>（旗舰旗舰模型）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[zhipu_endpoint]" value="{:sysconf('ai.zhipu_endpoint')}" placeholder="默认：https://open.bigmodel.cn/api/paas/v4/chat/completions" class="layui-input">
                <p class="help-block">兼容 OpenAI 规范的 API 地址，留空时使用官方默认地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">采样温度</b><br><span class="nowrap color-desc">Temperature</span>
            </label>
            <div class="layui-input-block">
                <input name="ai[temperature]" value="{:sysconf('ai.temperature')?:'0.7'}" placeholder="0.0 ~ 1.0" class="layui-input">
                <p class="help-block">模型回答的多样性倾向，建议 0.5 ~ 0.95</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
