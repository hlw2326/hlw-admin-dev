<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card label-width-130">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="notice[type]" value="dingtalk">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://open.dingtalk.com/document/robots/custom-robot-access">钉钉自定义机器人</a> 推送系统通知</p>
            <p>在钉钉群中添加「自定义机器人」，获取 Webhook 地址，若开启安全设置请填写加签密钥</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">Webhook</b><br><span class="nowrap color-desc">地址</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[dingtalk_webhook]" value="{:sysconf('notice.dingtalk_webhook')}" required vali-name="Webhook 地址" placeholder="https://oapi.dingtalk.com/robot/send?access_token=xxx" class="layui-input">
                <p class="help-block">钉钉机器人的 Webhook 请求地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">加签密钥</b><br><span class="nowrap color-desc">Secret</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[dingtalk_secret]" value="{:sysconf('notice.dingtalk_secret')}" placeholder="未开启加签可留空，以 SEC 开头" class="layui-input">
                <p class="help-block">在钉钉机器人安全设置中勾选「加签」时生成的密钥</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">默认 @ 手机号</b><br><span class="nowrap color-desc">Mobiles</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[dingtalk_to]" value="{:sysconf('notice.dingtalk_to')}" placeholder="多个手机号用英文逗号分隔" class="layui-input">
                <p class="help-block">发送通知时需要 @ 提醒的群成员手机号</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-normal" type="button" data-load="{:sysuri('test')}" data-value="type#dingtalk;action#text">文本测试</button>
        <button class="layui-btn layui-btn-warm" type="button" data-load="{:sysuri('test')}" data-value="type#dingtalk;action#card">卡片测试</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
