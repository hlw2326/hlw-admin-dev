<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="notice[type]" value="feishu">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://open.feishu.cn/document/client-docs/bot-v3/add-custom-bot">飞书自定义机器人</a> 推送系统通知</p>
            <p>在飞书群中添加「自定义机器人」，获取 Webhook 地址，若开启安全设置请填写签名密钥</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">Webhook</b><br><span class="nowrap color-desc">地址</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[feishu_webhook]" value="{:sysconf('notice.feishu_webhook')}" required vali-name="Webhook 地址" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxx" class="layui-input">
                <p class="help-block">飞书机器人的 Webhook 请求地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">签名密钥</b><br><span class="nowrap color-desc">Secret</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[feishu_secret]" value="{:sysconf('notice.feishu_secret')}" placeholder="未开启签名校验可留空" class="layui-input">
                <p class="help-block">在飞书机器人安全设置中勾选「签名校验」时生成的密钥</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-normal" type="button" data-load="{:sysuri('test')}" data-value="type#feishu;action#text">文本测试</button>
        <button class="layui-btn layui-btn-warm" type="button" data-load="{:sysuri('test')}" data-value="type#feishu;action#card">卡片测试</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
