<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="notice[type]" value="mail">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="javascript:;">SMTP 邮件服务</a> 发送邮件通知</p>
            <p>支持 163、QQ 邮箱、企业邮箱等标准 SMTP 协议，支持 SSL 和 TLS 加密传输</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">SMTP 服务器</b><br><span class="nowrap color-desc">Host</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_host]" value="{:sysconf('notice.mail_host')}" required vali-name="SMTP 服务器" placeholder="如：smtp.163.com 或 smtp.qq.com" class="layui-input">
                <p class="help-block">邮件发送服务器的域名地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">服务器端口</b><br><span class="nowrap color-desc">Port</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_port]" value="{:sysconf('notice.mail_port')}" placeholder="465" class="layui-input">
                <p class="help-block">常规端口：无加密 25，SSL 加密通常为 465，TLS 通常为 587</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">安全协议</b><br><span class="nowrap color-desc">Secure</span>
            </label>
            <div class="layui-input-block">
                <select name="notice[mail_secure]">
                    <option value="" {if sysconf('notice.mail_secure') eq ''}selected{/if}>无加密 (PORT 25)</option>
                    <option value="ssl" {if sysconf('notice.mail_secure') eq 'ssl'}selected{/if}>SSL (推荐, PORT 465)</option>
                    <option value="tls" {if sysconf('notice.mail_secure') eq 'tls'}selected{/if}>STARTTLS (PORT 587)</option>
                </select>
                <p class="help-block">推荐启用 SSL 加密保障邮件账号安全</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">登录账号</b><br><span class="nowrap color-desc">Username</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_user]" value="{:sysconf('notice.mail_user')}" required vali-name="登录账号" placeholder="请输入发件邮箱登录账号" class="layui-input">
                <p class="help-block">SMTP 发信认证账号，一般为完整邮箱地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">登录密码</b><br><span class="nowrap color-desc">Password</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_pass]" value="{:sysconf('notice.mail_pass')}" type="password" required vali-name="登录密码" placeholder="授权码或邮箱密码" class="layui-input">
                <p class="help-block">大部分主流邮箱（如 QQ、163）需要填写专属的 SMTP 授权码</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">发件人地址</b><br><span class="nowrap color-desc">From</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_from]" value="{:sysconf('notice.mail_from')}" placeholder="留空时默认使用登录账号" class="layui-input">
                <p class="help-block">发件人邮件地址</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">发件人名称</b><br><span class="nowrap color-desc">FromName</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_name]" value="{:sysconf('notice.mail_name')}" placeholder="HlwAdmin" class="layui-input">
                <p class="help-block">邮件列表上显示的发件人昵称</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认接收邮箱</b><br><span class="nowrap color-desc">To</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[mail_to]" value="{:sysconf('notice.mail_to')}" required vali-name="默认接收邮箱" placeholder="多个邮箱用英文逗号分隔" class="layui-input">
                <p class="help-block">默认接收通知的管理员邮箱地址</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-normal" type="button" data-load="{:sysuri('test')}" data-value="type#mail;action#text">文本测试</button>
        <button class="layui-btn layui-btn-warm" type="button" data-load="{:sysuri('test')}" data-value="type#mail;action#card">HTML卡片测试</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
