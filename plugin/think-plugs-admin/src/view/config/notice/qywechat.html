<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card label-width-130">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="type" value="qywechat">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://work.weixin.qq.com/api/doc/90000/90136/91770">企业微信群机器人</a> 推送群聊通知</p>
            <p>在企业微信群聊中添加「群机器人」，获取 Webhook 地址后填入下方配置</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">Webhook 地址</b><br><span class="nowrap color-desc">Hook Url</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[qywechat_url]" value="{:sysconf('notice.qywechat_url')}" required vali-name="Webhook 地址" placeholder="请输入企业微信群机器人 Webhook 地址" class="layui-input">
                <p class="help-block">如：https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">提醒成员手机号</b><br><span class="nowrap color-desc">Mentioned</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[qywechat_mobile]" value="{:sysconf('notice.qywechat_mobile')}" placeholder="请输入需要 @ 的群成员手机号（可选）" class="layui-input">
                <p class="help-block">多个手机号请用半角逗号分隔，填入 <code>@all</code> 可提醒群内全部成员</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-normal" type="button" data-load="{:sysuri('test')}" data-value="type#qywechat;action#text">文本测试</button>
        <button class="layui-btn layui-btn-warm" type="button" data-load="{:sysuri('test')}" data-value="type#qywechat;action#card">卡片测试</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
