<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="notice[type]" value="sms">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="javascript:;">手机短信</a> 发送重要事件预警与通知</p>
            <p>短信底层服务商密钥及模板由下方的「短信引擎」单独配置</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">短信服务商</b><br><span class="nowrap color-desc">Provider</span>
            </label>
            <div class="layui-input-block">
                <div class="layui-input layui-bg-gray flex flex-align-center" style="height:38px;padding:0 10px;justify-content:space-between;">
                    <div>
                        {if !empty($smsReady)}
                        <span class="layui-badge layui-bg-green">已配置</span>
                        <span class="margin-left-5 color-desc">当前服务商：{$smsName}</span>
                        {else}
                        <span class="layui-badge layui-bg-orange">未配置</span>
                        <span class="margin-left-5 color-desc">尚未完善短信服务商配置信息</span>
                        {/if}
                    </div>
                    <!--{if auth('sms')}-->
                    <a data-modal="{:sysuri('admin/config/sms')}?type={:sysconf('sms.type') ?: 'aliyun'}" class="layui-btn layui-btn-xs layui-btn-normal">设置服务商参数</a>
                    <!--{/if}-->
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">接收手机号</b><br><span class="nowrap color-desc">Mobiles</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[sms_to]" value="{:sysconf('notice.sms_to')}" required vali-name="接收手机号" placeholder="多个手机号用英文逗号分隔" class="layui-input">
                <p class="help-block">默认接收通知短信的管理员手机号码</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        {if !empty($smsReady)}
        <button type="button" class="layui-btn layui-btn-normal" data-notice-test="sms">发送测试</button>
        {else}
        <button type="button" class="layui-btn layui-btn-disabled" title="请先配置短信服务商参数">发送测试</button>
        {/if}
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>

<script>
    $('body').off('click', '[data-notice-test]').on('click', '[data-notice-test]', function () {
        $.form.load("{:sysuri('admin/config/test')}", {type: this.dataset.noticeTest}, 'post');
    });
</script>
