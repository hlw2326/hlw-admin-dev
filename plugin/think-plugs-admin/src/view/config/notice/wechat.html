<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card label-width-130">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="notice[type]" value="wechat">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://mp.weixin.qq.com/">微信公众号</a> 发送模板消息通知</p>
            <p>需为已认证的服务号，在公众号后台添加模板消息，模板需包含 title 与 content 字段</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">公众号 AppID</b><br><span class="nowrap color-desc">AppID</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[wechat_appid]" value="{:sysconf('notice.wechat_appid')}" required vali-name="公众号 AppID" placeholder="请输入公众号 AppID" class="layui-input">
                <p class="help-block">可以在 [ 微信公众平台 > 设置与开发 > 基本配置 ] 获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AppSecret</b><br><span class="nowrap color-desc">AppSecret</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[wechat_secret]" value="{:sysconf('notice.wechat_secret')}" required vali-name="AppSecret" placeholder="请输入公众号 AppSecret" class="layui-input">
                <p class="help-block">可以在 [ 微信公众平台 > 设置与开发 > 基本配置 ] 获取开发者密码</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">模板编号</b><br><span class="nowrap color-desc">Template ID</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[wechat_tpl]" value="{:sysconf('notice.wechat_tpl')}" required vali-name="模板编号" placeholder="请输入模板消息 ID" class="layui-input">
                <p class="help-block">模板内容字段需对应包含 title 与 content 两个参数</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">接收人 OpenID</b><br><span class="nowrap color-desc">OpenID</span>
            </label>
            <div class="layui-input-block">
                <input name="notice[wechat_to]" value="{:sysconf('notice.wechat_to')}" required vali-name="接收人 OpenID" placeholder="多个 OpenID 用英文逗号分隔" class="layui-input">
                <p class="help-block">接收通知管理员关注公众号后的用户 OpenID</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-normal" type="button" data-load="{:sysuri('test')}" data-value="type#wechat;action#text">文本测试</button>
        <button class="layui-btn layui-btn-warm" type="button" data-load="{:sysuri('test')}" data-value="type#wechat;action#card">卡片跳转测试</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
