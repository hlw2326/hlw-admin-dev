<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="payment[type]" value="stripe">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://dashboard.stripe.com/">Stripe 全球聚合支付</a></p>
            <p>基于 Stripe Payment Intents 现代支付接口，支持全球信用卡、Apple Pay、Google Pay 等多种支付方式</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">Publishable Key</b><br><span class="nowrap color-desc">可公开密钥</span>
            </label>
            <div class="layui-input-block">
                <input name="payment[stripe_publishable_key]" value="{:sysconf('payment.stripe_publishable_key')}" required vali-name="Publishable Key" placeholder="pk_live_... 或 pk_test_..." class="layui-input">
                <p class="help-block">在 [ Stripe 控制台 > 开发者 > API 密钥 ] 中获取，用于前端调起支付控件</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">Secret Key</b><br><span class="nowrap color-desc">安全密钥</span>
            </label>
            <div class="layui-input-block">
                <input name="payment[stripe_secret_key]" value="{:sysconf('payment.stripe_secret_key')}" required vali-name="Secret Key" placeholder="sk_live_... 或 sk_test_..." class="layui-input">
                <p class="help-block">在 [ Stripe 控制台 > 开发者 > API 密钥 ] 中获取，用于服务端接口调用</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">Webhook Secret</b><br><span class="nowrap color-desc">签名密钥</span>
            </label>
            <div class="layui-input-block">
                <input name="payment[stripe_webhook_secret]" value="{:sysconf('payment.stripe_webhook_secret')}" placeholder="whsec_..." class="layui-input">
                <p class="help-block">在 [ Stripe 控制台 > Webhooks ] 中创建终端后获取签名密钥</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认币种</b><br><span class="nowrap color-desc">Currency</span>
            </label>
            <div class="layui-input-block">
                <input name="payment[stripe_currency]" value="{:sysconf('payment.stripe_currency')?:'usd'}" required vali-name="默认币种" placeholder="usd / cny / eur" class="layui-input">
                <p class="help-block">结算货币代码（小写字母），如：<code>usd</code>、<code>cny</code>、<code>eur</code></p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
