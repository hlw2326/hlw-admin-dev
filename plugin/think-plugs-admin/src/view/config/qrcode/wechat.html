<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="qrcode[type]" value="wechat">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://mp.weixin.qq.com/">微信公众平台 · 小程序</a></p>
            <p>支持生成无数量限制小程序码（Scene 模式）、限量小程序码（Path 模式）及标准小程序二维码</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">小程序 AppID</b><br><span class="nowrap color-desc">AppID</span>
            </label>
            <div class="layui-input-block">
                <input name="qrcode[wechat_appid]" value="{:sysconf('qrcode.wechat_appid')}" required vali-name="小程序 AppID" placeholder="如：wx8888888888888888" class="layui-input">
                <p class="help-block">微信小程序后台 [ 开发管理 > 开发设置 ] 中获取的 AppID(小程序ID)</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">小程序 AppSecret</b><br><span class="nowrap color-desc">AppSecret</span>
            </label>
            <div class="layui-input-block">
                <input name="qrcode[wechat_secret]" value="{:sysconf('qrcode.wechat_secret')}" required vali-name="小程序 AppSecret" placeholder="32位字符密钥" class="layui-input">
                <p class="help-block">微信小程序后台 [ 开发管理 > 开发设置 ] 中生成的 AppSecret(小程序密钥)</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
