<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card label-width-130">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="aliyun">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://dysms.console.aliyun.com/">阿里云短信</a> 发送验证码与通知</p>
            <p>需在阿里云短信控制台申请签名与模板，模板变量名请使用 title 与 content</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AccessKeyId</b><br><span class="nowrap color-desc">AccessKey</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[aliyun_key]" value="{:sysconf('sms.aliyun_key')}" required vali-name="AccessKeyId" placeholder="请输入阿里云 AccessKeyId" class="layui-input">
                <p class="help-block">可以在 [ 阿里云 > 用户 AccessKey 管理 ] 获取访问密钥</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AccessKeySecret</b><br><span class="nowrap color-desc">SecretKey</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[aliyun_secret]" value="{:sysconf('sms.aliyun_secret')}" required vali-name="AccessKeySecret" placeholder="请输入阿里云 AccessKeySecret" class="layui-input">
                <p class="help-block">可以在 [ 阿里云 > 用户 AccessKey 管理 ] 获取安全密钥</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">短信签名</b><br><span class="nowrap color-desc">SignName</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[aliyun_sign]" value="{:sysconf('sms.aliyun_sign')}" required vali-name="短信签名" placeholder="请输入已审核通过的短信签名名称" class="layui-input">
                <p class="help-block">在阿里云国内消息配置的签名名称，如：某某企业</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">模板编号</b><br><span class="nowrap color-desc">TemplateCode</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[aliyun_tpl]" value="{:sysconf('sms.aliyun_tpl')}" required vali-name="默认模板编号" placeholder="如：SMS_123456789" class="layui-input">
                <p class="help-block">阿里云国内消息审核通过的模板 Code，模板内请包含 ${title} 与 ${content} 变量</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
