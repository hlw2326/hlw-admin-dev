<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="cl253">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://zz.253.com/">创蓝云通讯 (253)</a> 发送验证码与通知短信</p>
            <p>需在创蓝253控制台获取 API 账号与密码，并配置审核通过的短信签名与内容模板</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API 账号</b><br><span class="nowrap color-desc">Account</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cl253_account]" value="{:sysconf('sms.cl253_account')}" required vali-name="API 账号" placeholder="请输入创蓝253 API 账号" class="layui-input">
                <p class="help-block">在创蓝253控制台 [ 产品管理 > 验证码通知 ] 查看 API 账号</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">API 密码</b><br><span class="nowrap color-desc">Password</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cl253_password]" value="{:sysconf('sms.cl253_password')}" required vali-name="API 密码" placeholder="请输入创蓝253 API 密码" class="layui-input">
                <p class="help-block">在创蓝253控制台获取的对应 API 接口密码</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">短信签名</b><br><span class="nowrap color-desc">SignName</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cl253_sign]" value="{:sysconf('sms.cl253_sign')}" required vali-name="短信签名" placeholder="如：HlwAdmin" class="layui-input">
                <p class="help-block">创蓝253审核通过的短信签名（无需手动加【】，系统将自动组装）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模板</b><br><span class="nowrap color-desc">Template</span>
            </label>
            <div class="layui-input-block">
                <textarea name="sms[cl253_tpl]" required vali-name="默认内容模板" placeholder="如：您的验证码为：&#123;$code&#125;，5分钟内有效。" class="layui-textarea">{:sysconf('sms.cl253_tpl')}</textarea>
                <p class="help-block">在创蓝253报备的短信模板文本，支持变量占位符如 <code>&#123;$code&#125;</code>、<code>&#123;$title&#125;</code>、<code>&#123;$content&#125;</code></p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
