<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="cloopen">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://www.yuntongxun.com/">容联·云通讯短信</a> 发送验证码与业务通知</p>
            <p>需在容联云控制台获取开发者主账号 AccountSid、AuthToken、AppId 并审核短信模板</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AccountSid</b><br><span class="nowrap color-desc">主账号标识</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cloopen_sid]" value="{:sysconf('sms.cloopen_sid')}" required vali-name="AccountSid" placeholder="请输入容联云 AccountSid" class="layui-input">
                <p class="help-block">在 [ 容联云控制台 > 总览 ] 查看开发者主账号 ACCOUNT SID</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AuthToken</b><br><span class="nowrap color-desc">主账号令牌</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cloopen_token]" value="{:sysconf('sms.cloopen_token')}" required vali-name="AuthToken" placeholder="请输入容联云 AUTH TOKEN" class="layui-input">
                <p class="help-block">在 [ 容联云控制台 > 总览 ] 查看 AUTH TOKEN</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AppId</b><br><span class="nowrap color-desc">应用编号</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cloopen_appid]" value="{:sysconf('sms.cloopen_appid')}" required vali-name="AppId" placeholder="请输入容联云应用 AppId" class="layui-input">
                <p class="help-block">在 [ 容联云控制台 > 应用管理 ] 查看对应应用的 AppId</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">模板编号</b><br><span class="nowrap color-desc">TemplateId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[cloopen_tpl]" value="{:sysconf('sms.cloopen_tpl')}" required vali-name="模板编号" placeholder="如：1 或审核通过的模板 ID" class="layui-input">
                <p class="help-block">在容联云短信控制台已审核通过的模板 ID，模板变量按 {1}、{2} 顺序传入</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
