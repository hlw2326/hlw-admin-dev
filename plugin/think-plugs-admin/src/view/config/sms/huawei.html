<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="huawei">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://console.huaweicloud.com/msgsms/">华为云消息&短信</a> 发送验证码与通知</p>
            <p>需在华为云控制台申请国内短信签名与模板，并获取应用 AppKey、AppSecret 与通道号</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AppKey</b><br><span class="nowrap color-desc">应用标识</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[huawei_app_key]" value="{:sysconf('sms.huawei_app_key')}" required vali-name="AppKey" placeholder="请输入华为云短信应用 AppKey" class="layui-input">
                <p class="help-block">在 [ 华为云控制台 > 消息&短信 > 应用管理 ] 中查看 AppKey</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">AppSecret</b><br><span class="nowrap color-desc">应用密钥</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[huawei_app_secret]" value="{:sysconf('sms.huawei_app_secret')}" required vali-name="AppSecret" placeholder="请输入华为云短信应用 AppSecret" class="layui-input">
                <p class="help-block">在创建短信应用时获取的 AppSecret 密钥</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">通道号 (Sender)</b><br><span class="nowrap color-desc">国内短信签名通道</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[huawei_sender]" value="{:sysconf('sms.huawei_sender')}" required vali-name="通道号" placeholder="如：csms12345678 或 1069 开头通道号" class="layui-input">
                <p class="help-block">在 [ 华为云控制台 > 应用管理 ] 中获取的对应国内短信通道号</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">短信签名</b><br><span class="nowrap color-desc">Signature</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[huawei_sign]" value="{:sysconf('sms.huawei_sign')}" placeholder="请输入已审核通过的短信签名名称（可选）" class="layui-input">
                <p class="help-block">在华为云申请并审核通过的国内短信签名名称</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">模板编号</b><br><span class="nowrap color-desc">TemplateId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[huawei_tpl]" value="{:sysconf('sms.huawei_tpl')}" required vali-name="模板编号" placeholder="如：8ff55eac1d0b4781b060c3da487727ec" class="layui-input">
                <p class="help-block">华为云国内短信已审核通过的模板 ID，模板变量使用 ${1}、${2} 占位</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">接口地址</b><br><span class="nowrap color-desc">Endpoint</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[huawei_endpoint]" value="{:sysconf('sms.huawei_endpoint')}" placeholder="默认：https://smsapi.cn-north-4.myhuaweicloud.com:443" class="layui-input">
                <p class="help-block">华为云短信服务接入地址，留空时使用华北-北京四默认地址</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
