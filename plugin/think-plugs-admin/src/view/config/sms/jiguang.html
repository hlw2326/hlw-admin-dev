<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="jiguang">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://www.jiguang.cn/sms">极光短信 (JSMS)</a> 发送验证码与业务通知</p>
            <p>需在极光开发者平台创建应用，获取 DevKey 与 DevSecret，并配置数字模板 ID</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">开发者标识</b><br><span class="nowrap color-desc">DevKey</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[jiguang_dev_key]" value="{:sysconf('sms.jiguang_dev_key')}" required vali-name="DevKey" placeholder="请输入极光推送 DevKey (AppKey)" class="layui-input">
                <p class="help-block">极光开发者服务 [ 应用设置 > 应用信息 ] 中的 AppKey</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">开发密钥</b><br><span class="nowrap color-desc">DevSecret</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[jiguang_dev_secret]" value="{:sysconf('sms.jiguang_dev_secret')}" required vali-name="DevSecret" placeholder="请输入极光推送 DevSecret (Master Secret)" class="layui-input">
                <p class="help-block">极光开发者服务中的 Master Secret（系统将自动进行 Basic Auth 鉴权）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模板</b><br><span class="nowrap color-desc">TempId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[jiguang_tpl_id]" value="{:sysconf('sms.jiguang_tpl_id')}" required vali-name="默认模板ID" placeholder="如：12345" class="layui-input">
                <p class="help-block">极光短信控制台审核通过的数字模板编号 temp_id</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">短信签名ID</b><br><span class="nowrap color-desc">SignId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[jiguang_sign_id]" value="{:sysconf('sms.jiguang_sign_id')}" vali-name="签名编号" placeholder="可选，如：1234" class="layui-input">
                <p class="help-block">极光短信控制台审核通过的数字签名 ID (sign_id)，留空则使用应用默认签名</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
