<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="montn">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://www.montnets.com/">梦网科技短信</a> 发送验证码与行业通知</p>
            <p>需在梦网云通讯平台开通接口账号，三网合一高可用通道，系统自动进行动态时间戳 MD5 加密</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">用户账号</b><br><span class="nowrap color-desc">UserID</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[montn_user]" value="{:sysconf('sms.montn_user')}" required vali-name="UserID" placeholder="请输入梦网短信 UserID 账号" class="layui-input">
                <p class="help-block">梦网云通讯平台分配的短信接口账号 UserID</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">接口密码</b><br><span class="nowrap color-desc">Password</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[montn_pwd]" value="{:sysconf('sms.montn_pwd')}" required vali-name="Password" placeholder="请输入梦网短信接口密码" class="layui-input">
                <p class="help-block">梦网短信接口通讯密码（系统将自动进行动态 MD5 时间戳防重放加密）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">短信签名</b><br><span class="nowrap color-desc">SignName</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[montn_sign]" value="{:sysconf('sms.montn_sign')}" vali-name="短信签名" placeholder="如：某某企业" class="layui-input">
                <p class="help-block">在梦网报备通过的企业短信签名，下发时将自动组装【签名】前缀</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">默认文案</b><br><span class="nowrap color-desc">Template</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[montn_tpl]" value="{:sysconf('sms.montn_tpl')}" vali-name="默认短信文案" placeholder="如：您的验证码是{code}，请于{time}分钟内使用。" class="layui-input">
                <p class="help-block">默认短信内容模板，支持 <code>&#123;code&#125;</code>、<code>&#123;time&#125;</code> 变量占位符替换</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
