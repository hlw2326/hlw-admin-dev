<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="netease">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://yunxin.163.com/sms">网易云信短信</a> 发送验证码与通知</p>
            <p>需在网易云信控制台开通短信服务，获取 AppKey 与 AppSecret，并创建审核通过的模板ID</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">开发者标识</b><br><span class="nowrap color-desc">AppKey</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[netease_appkey]" value="{:sysconf('sms.netease_appkey')}" required vali-name="AppKey" placeholder="请输入网易云信 AppKey" class="layui-input">
                <p class="help-block">网易云信控制台 [ 应用管理 > Appkey 管理 ] 获取的 AppKey</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">安全密钥</b><br><span class="nowrap color-desc">AppSecret</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[netease_appsecret]" value="{:sysconf('sms.netease_appsecret')}" required vali-name="AppSecret" placeholder="请输入网易云信 AppSecret" class="layui-input">
                <p class="help-block">网易云信控制台获取的 AppSecret（系统将自动进行动态 Nonce+CurTime+CheckSum 鉴权）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模板</b><br><span class="nowrap color-desc">TemplateId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[netease_tpl]" value="{:sysconf('sms.netease_tpl')}" required vali-name="默认模板ID" placeholder="如：123456" class="layui-input">
                <p class="help-block">网易云信审核通过的模板编号 templateid，短信变量按参数列表顺序匹配</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
