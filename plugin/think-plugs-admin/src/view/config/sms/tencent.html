<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card label-width-120">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="tencent">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://console.cloud.tencent.com/smsv2">腾讯云短信</a> 发送验证码与通知</p>
            <p>需在腾讯云短信控制台创建应用并申请签名与模板，模板变量按 title、content 顺序替换</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">SmsSdkAppId</b><br><span class="nowrap color-desc">AppId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[tencent_appid]" value="{:sysconf('sms.tencent_appid')}" required vali-name="SmsSdkAppId" placeholder="请输入腾讯云短信应用 ID" class="layui-input">
                <p class="help-block">在 [ 腾讯云短信 > 应用管理 > 应用列表 ] 中获取 SmsSdkAppId</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">SecretId</b><br><span class="nowrap color-desc">SecretId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[tencent_key]" value="{:sysconf('sms.tencent_key')}" required vali-name="SecretId" placeholder="请输入腾讯云访问密钥 SecretId" class="layui-input">
                <p class="help-block">可以在 [ 腾讯云控制台 > 访问管理 > API 密钥管理 ] 获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">SecretKey</b><br><span class="nowrap color-desc">SecretKey</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[tencent_secret]" value="{:sysconf('sms.tencent_secret')}" required vali-name="SecretKey" placeholder="请输入腾讯云访问密钥 SecretKey" class="layui-input">
                <p class="help-block">可以在 [ 腾讯云控制台 > 访问管理 > API 密钥管理 ] 获取</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">
                <b class="color-green">地域代号</b><br><span class="nowrap color-desc">Region</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[tencent_region]" value="{:sysconf('sms.tencent_region')}" placeholder="ap-guangzhou" class="layui-input">
                <p class="help-block">腾讯云短信地域接入点，默认可填写 ap-guangzhou 或 ap-nanjing 等</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">短信签名</b><br><span class="nowrap color-desc">SignName</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[tencent_sign]" value="{:sysconf('sms.tencent_sign')}" required vali-name="短信签名" placeholder="请输入已审核通过的短信签名内容" class="layui-input">
                <p class="help-block">需填写在腾讯云已审核通过的签名内容（不需要加【】）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">模板 ID</b><br><span class="nowrap color-desc">TemplateId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[tencent_tpl]" value="{:sysconf('sms.tencent_tpl')}" required vali-name="默认模板 ID" placeholder="请输入已审核通过的正文模板 ID" class="layui-input">
                <p class="help-block">正文模板 ID，变量按 {1}=title，{2}=content 顺序填入</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
