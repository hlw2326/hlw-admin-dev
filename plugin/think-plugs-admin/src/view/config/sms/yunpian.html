<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="yunpian">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="https://www.yunpian.com/">云片网络短信</a> 发送验证码与通知</p>
            <p>需在云片控制台获取开发者 APIKEY 密钥，并配置审核通过的模板 ID</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">接口密钥</b><br><span class="nowrap color-desc">APIKEY</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[yunpian_apikey]" value="{:sysconf('sms.yunpian_apikey')}" required vali-name="APIKEY" placeholder="请输入云片网络 APIKEY" class="layui-input">
                <p class="help-block">在云片控制台获取的开发者 APIKEY 密钥</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模板</b><br><span class="nowrap color-desc">TplId</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[yunpian_tpl]" value="{:sysconf('sms.yunpian_tpl')}" required vali-name="默认模板ID" placeholder="如：1234567" class="layui-input">
                <p class="help-block">在云片审核通过的模板 ID，模板变量支持 <code>#code#</code>、<code>#min#</code> 格式</p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
