<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card">
    <div class="layui-card-body padding-left-40">

        <input type="hidden" name="sms[type]" value="ztsms">

        <div class="color-text layui-code text-center layui-bg-gray" style="border-left-width:1px;margin:0 0 15px 0">
            <p class="margin-bottom-5 font-w7">使用 <a target="_blank" href="http://mix2.zthysms.com/">助通科技短信</a> 发送验证码与业务通知</p>
            <p>需在助通短信平台开通子账号与接口密码，并报备短信签名与短信模板</p>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">账号名称</b><br><span class="nowrap color-desc">Username</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[ztsms_username]" value="{:sysconf('sms.ztsms_username')}" required vali-name="账号名称" placeholder="请输入助通短信子账号" class="layui-input">
                <p class="help-block">在助通短信管理后台获取的 API 发送账号</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">账号密码</b><br><span class="nowrap color-desc">Password</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[ztsms_password]" value="{:sysconf('sms.ztsms_password')}" required vali-name="账号密码" placeholder="请输入助通短信接口密码" class="layui-input">
                <p class="help-block">在助通短信管理后台设置的接口对接密码</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">短信签名</b><br><span class="nowrap color-desc">SignName</span>
            </label>
            <div class="layui-input-block">
                <input name="sms[ztsms_sign]" value="{:sysconf('sms.ztsms_sign')}" required vali-name="短信签名" placeholder="如：HlwAdmin" class="layui-input">
                <p class="help-block">助通审核通过的短信签名名称（系统将自动补齐【】）</p>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required">
                <b class="color-green">默认模板</b><br><span class="nowrap color-desc">Template</span>
            </label>
            <div class="layui-input-block">
                <textarea name="sms[ztsms_tpl]" required vali-name="默认内容模板" placeholder="如：您的验证码为：&#123;$code&#125;，请在5分钟内输入验证。" class="layui-textarea">{:sysconf('sms.ztsms_tpl')}</textarea>
                <p class="help-block">在助通短信报备的内容模板，支持变量占位符如 <code>&#123;$code&#125;</code>、<code>&#123;$title&#125;</code>、<code>&#123;$content&#125;</code></p>
            </div>
        </div>

    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存配置</button>
        <button class="layui-btn layui-btn-danger" type="button" data-confirm="确定要取消修改吗？" data-close>取消修改</button>
    </div>
</form>
